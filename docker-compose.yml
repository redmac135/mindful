version: "2"

services:
  nginx:
    image: nginx:latest
    container_name: ng01
    ports:
      - "8000:8000"
    volumes:
      - ./mindful/staticfiles:/src/static
      - ./config/nginx:/etc/nginx/conf.d
    depends_on:
      - web
  web:
    build: .
    container_name: dg01
    command: bash -c "python manage.py makemigrations && python manage.py migrate && gunicorn mindful.wsgi -b 0.0.0.0:8000"
    depends_on:
      - db
    volumes:
      - ./mindful:/src
    env_file:
      - .env
    expose:
      - "8000"

  db:
    image: postgres:latest
    container_name: ps01
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=${DATABASE_PORT}
