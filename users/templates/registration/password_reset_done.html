{% extends 'base/base.html' %}

{% block title %}Password reset{% endblock %}

{% block content %}
<div class="flex justify-center text-center h-screen">
	<div class="p-5 m-auto bg-mindful-gray-100 border-4 border-mindful-gray-500 w-200 rounded-3xl">
		<div class="text-xl font-bold mx-3.5 mt-2.5 mb-6 rounded-2xl border-2 border-amber-500 bg-amber-100 py-5">Email sent!
		</div>
		<div class="mx-3.5 mt-2.5 mb-4 rounded-2xl border-2 border-mindful-blue-500 bg-mindful-blue-100 py-2">
			<p class="my-1 w-3/5 m-auto text-lg font-semibold">Check your inbox!</p>
			<p class="my-1 w-3/5 m-auto">We've emailed you instructions for resetting your password. Be sure to check your spam folder.</p>
		</div>
		<div>Please <a href="{% url 'login' %}" class="text-blue-500">Log In</a></div>
	</div>
</div>
{% endblock %}
