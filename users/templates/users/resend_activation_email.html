{% extends 'base/base.html' %}

{% block title %}Resend Verification Email{% endblock %}

{% block content %}
  <h1>Resend Verification Email?</h1>
  <p>Enter your email address below, and we'll send another email to you</p>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Send Verification Email">
  </form>
{% endblock %}
